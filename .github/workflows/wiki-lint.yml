name: Wiki lint

on:
  push:
    branches: ["main", "agent/reorganitza-wiki-llm"]
  pull_request:
    branches: ["main", "agent/reorganitza-wiki-llm"]

permissions:
  contents: read

jobs:
  wiki-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run wiki lint
        run: python scripts/wiki_lint.py
